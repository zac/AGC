name: Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Swift 6
        uses: fwal/setup-swift@v1
        with:
          swift-version: '6.0'
      - name: Build and Test
        run: swift test 